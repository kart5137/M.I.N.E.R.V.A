name: Weekly pipeline

# Refreshes FluNet, retrains and selects forecast models, runs detection and alerts,
# prunes old run detail and publishes the weekly global report.
#
# Target database: the DATABASE_URL repository secret (production). Without it the job
# runs end to end against a throwaway PostGIS service instead, so the workflow can be
# checked before anything is deployed.

on:
  schedule:
    - cron: "0 6 * * 3"  # Wednesdays 06:00 UTC
  workflow_dispatch:
    inputs:
      fast:
        description: "Small forecast models (quick check, not for production)"
        type: boolean
        default: false

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ei
          POSTGRES_PASSWORD: ei
          POSTGRES_DB: epidemic_intelligence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ei -d epidemic_intelligence"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql+psycopg://ei:ei@localhost:5432/epidemic_intelligence' }}
      EI_WEEKLY_ARGS: ${{ inputs.fast && '--fast' || '' }}
      PYTHONIOENCODING: utf-8
      EI_ROOT: ${{ github.workspace }}  # packages are installed, not editable
    steps:
      - uses: actions/checkout@v4

      - name: Target
        env:
          HAS_SECRET: ${{ secrets.DATABASE_URL != '' }}
        run: |
          if [ "$HAS_SECRET" = "true" ]; then
            echo "Target: production database (DATABASE_URL secret)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No DATABASE_URL secret; dry run against a throwaway database."
            echo "Target: throwaway database (dry run)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            packages/ei_db/pyproject.toml
            services/api/pyproject.toml
            pipeline/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/ei_db ./services/api ./pipeline

      # Boundaries and World Bank files change rarely: reuse them for a month.
      # FluNet is always downloaded fresh by `ei weekly`.
      - name: Cache reference downloads
        uses: actions/cache@v4
        with:
          path: |
            data/raw/natural_earth
            data/raw/worldbank
          key: raw-reference-${{ github.run_id }}
          restore-keys: raw-reference-

      - name: Weekly job
        shell: bash  # -eo pipefail: a failing step fails the job despite the tee
        run: sh pipeline/scripts/weekly.sh 2>&1 | tee weekly.log

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            grep -E '^\[|^\{|^== ' weekly.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep model artefacts and card
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: models-${{ github.run_number }}
          path: |
            models/
            docs/models/
          retention-days: 30
