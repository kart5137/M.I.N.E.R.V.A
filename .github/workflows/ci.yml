name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ei
          POSTGRES_PASSWORD: ei
          POSTGRES_DB: minerva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ei -d minerva"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ei:ei@localhost:5432/minerva
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/ei_db -e "services/api[dev]" -e "pipeline[dev]"
      - name: Lint
        run: ruff check packages services pipeline
      - name: Migrations (upgrade, downgrade, upgrade, drift check)
        working-directory: packages/ei_db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: API tests (unit + database integration), coverage >= 90%
        working-directory: services/api
        run: pytest -q -rs --cov=app --cov-report=term:skip-covered --cov-fail-under=90
      - name: Pipeline tests (unit + ingestion into a test database), coverage >= 90%
        working-directory: pipeline
        run: pytest -q -rs --cov=ei_pipeline --cov-report=term:skip-covered --cov-fail-under=90

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    # Builds the three images and smoke-tests the API and pipeline images against PostGIS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -f services/api/Dockerfile -t ei-api .
          docker build -f pipeline/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t ei-pipeline .
          docker build -t ei-web apps/web
      - name: Smoke test (migrate, seed, serve, query)
        run: |
          docker network create ei
          docker run -d --name db --network ei -e POSTGRES_USER=ei -e POSTGRES_PASSWORD=ei             -e POSTGRES_DB=minerva postgis/postgis:16-3.4
          until docker exec db pg_isready -U ei -d minerva; do sleep 2; done
          URL=postgresql://ei:ei@db:5432/minerva  # plain URL, as hosts give it
          docker run --rm --network ei -e DATABASE_URL=$URL ei-api             alembic -c packages/ei_db/alembic.ini upgrade head
          docker run --rm --network ei -e DATABASE_URL=$URL ei-pipeline ei ingest reference
          docker run -d --name api --network ei -p 8000:8000 -e DATABASE_URL=$URL ei-api
          for i in $(seq 30); do curl -fs localhost:8000/api/v1/health && break; sleep 1; done
          curl -fsS localhost:8000/api/v1/meta/status
          curl -fsS localhost:8000/api/v1/diseases | grep -q influenza
