name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ei
          POSTGRES_PASSWORD: ei
          POSTGRES_DB: epidemic_intelligence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ei -d epidemic_intelligence"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ei:ei@localhost:5432/epidemic_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/ei_db -e "services/api[dev]" -e "pipeline[dev]"
      - name: Lint
        run: ruff check packages services pipeline
      - name: Migrations (upgrade, downgrade, upgrade, drift check)
        working-directory: packages/ei_db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: API tests (unit + database integration)
        working-directory: services/api
        run: pytest -q -rs
      - name: Pipeline tests (unit + ingestion into a test database)
        working-directory: pipeline
        run: pytest -q -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
