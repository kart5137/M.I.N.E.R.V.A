name: Keep API awake

# Render's free plan stops the API after 15 minutes without requests, and the next visitor
# waits about a minute while it starts. A request to the health endpoint every 10 minutes
# keeps it running: one always-on free service uses ~744 of the 750 free instance hours a
# month. /health does not touch the database, so Neon still suspends when idle.
# GitHub may delay scheduled runs; the dashboard then shows a "waking up" notice.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL || 'https://minerva-api-0d86.onrender.com' }}
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            "$API_URL/api/v1/health"
