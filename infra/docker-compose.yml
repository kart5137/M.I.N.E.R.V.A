name: minerva

# `docker compose up -d` starts only the database (local development).
# Full stack from images:   docker compose --profile app up -d --build
# Weekly job in a container: docker compose --profile jobs run --rm pipeline

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ei}
      POSTGRES_DB: ${POSTGRES_DB:-minerva}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ei}:${POSTGRES_PASSWORD:-ei}@db:5432/${POSTGRES_DB:-minerva}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: ../apps/web
      args:
        # Called from the browser, so this is the host-visible API address.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  pipeline:
    profiles: [jobs]
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ei}:${POSTGRES_PASSWORD:-ei}@db:5432/${POSTGRES_DB:-minerva}
      EI_WEEKLY_ARGS: ${EI_WEEKLY_ARGS:-}
    volumes:
      - raw_data:/app/data/raw
      - model_artefacts:/app/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  raw_data:
  model_artefacts:
